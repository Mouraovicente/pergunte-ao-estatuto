services:
  neo4j:
    image: neo4j:5-community
    container_name: pergunte-ao-estatuto-neo4j
    ports:
      - "7474:7474" # Neo4j Browser (http://localhost:7474)
      - "7687:7687" # Bolt (usado pela aplicacao)
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
